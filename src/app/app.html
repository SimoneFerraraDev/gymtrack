<div class="shell">
  <main class="shell__content">
    <router-outlet></router-outlet>
  </main>

  <nav class="tabbar" aria-label="Navigazione principale">
    @for (tab of tabs; track tab.path) {
      <a
        class="tabbar__item"
        [routerLink]="tab.path"
        routerLinkActive="tabbar__item--active"
      >
        <span class="tabbar__icon" aria-hidden="true">
          @switch (tab.icon) {
            @case ('plans') {
              <svg viewBox="0 0 24 24" fill="none">
                <rect x="5" y="3" width="14" height="18" rx="2" stroke="currentColor" stroke-width="1.8"/>
                <path d="M9 8h6M9 12h6M9 16h3" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
              </svg>
            }
            @case ('workout') {
              <svg viewBox="0 0 24 24" fill="none">
                <path d="M6.5 8v8M17.5 8v8M3 10.5v3M21 10.5v3M6.5 12h11" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
                <rect x="4.5" y="6.5" width="4" height="11" rx="1.2" stroke="currentColor" stroke-width="1.8"/>
                <rect x="15.5" y="6.5" width="4" height="11" rx="1.2" stroke="currentColor" stroke-width="1.8"/>
              </svg>
            }
            @case ('history') {
              <svg viewBox="0 0 24 24" fill="none">
                <circle cx="12" cy="13" r="7.5" stroke="currentColor" stroke-width="1.8"/>
                <path d="M12 9v4.5l3 2" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
                <path d="M9 2.5h6" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
              </svg>
            }
            @case ('progress') {
              <svg viewBox="0 0 24 24" fill="none">
                <path d="M4 20V10M11 20V4M18 20v-6" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
              </svg>
            }
          }
        </span>
        <span class="tabbar__label">{{ tab.label }}</span>
      </a>
    }
  </nav>
</div>
